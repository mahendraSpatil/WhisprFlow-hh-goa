[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "codeloop-backend"
version = "0.1.0"
description = "CodeLoop backend: agent orchestrator and API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "GitPython>=3.1.41",
    "bandit>=1.8",
    "anthropic>=1.0",
    "PyGithub>=2.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
